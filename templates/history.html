<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>$title</h1>
      <nav><a href="/">Home</a><a href="/">New run</a><a href="/adaptive-run">Adaptive run</a><a href="/history">History</a><a href="/experiments">Experiments</a></nav>
    </header>

    <form action="/history" method="get" class="panel">
      <div class="grid">
        <label>
          Status
          <select name="status">$status_options</select>
        </label>
        <label>
          Experiment
          <input name="experiment" value="$experiment_filter" placeholder="standard_library_fallback">
        </label>
      </div>
      <button type="submit">Apply</button>
      <a class="clear-link" href="/history">Clear</a>
    </form>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Objective</th>
            <th>Success</th>
            <th>Failure</th>
            <th>Traces</th>
            <th>Experiment</th>
            <th>Detail</th>
          </tr>
        </thead>
        <tbody>$rows</tbody>
      </table>
    </section>
  </main>
</body>
</html>
