<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Integration Debug Tool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>API Integration Debug Tool</h1>
      <nav><a href="/">Home</a><a href="/">New run</a><a href="/adaptive-run">Adaptive run</a><a href="/adaptive-runs/history">Adaptive history</a><a href="/history">History</a><a href="/experiments">Experiments</a></nav>
    </header>

    <section class="panel">
      <h2>Integration Debug Timeline</h2>
      <p class="muted">Powered by adaptive execution repair attempts.</p>
      <p class="muted">Lightwell executes the integration, observes the real runtime result, and shows each repair attempt.</p>
    </section>

    <form id="adaptive-form" class="panel">
      <label>
        Endpoint URL
        <input id="endpoint-url" name="endpoint_url" type="url" placeholder="https://api.example.com/resource" required>
      </label>

      <div class="grid">
        <label>
          Method
          <select id="method" name="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
          </select>
        </label>
      </div>

      <label>
        JSON body
        <textarea id="json-body" name="json_body" rows="7" placeholder='{"hello": "world"}'></textarea>
      </label>

      <button id="run-button" type="submit">Run</button>
    </form>

    <section id="status-panel" class="panel hidden" aria-live="polite"></section>
    <section id="result-panel" class="panel hidden"></section>
  </main>

  <script>
    const endpoint = $adaptive_execution_api_url;
    const form = document.getElementById("adaptive-form");
    const endpointUrlInput = document.getElementById("endpoint-url");
    const methodInput = document.getElementById("method");
    const jsonBodyInput = document.getElementById("json-body");
    const runButton = document.getElementById("run-button");
    const statusPanel = document.getElementById("status-panel");
    const resultPanel = document.getElementById("result-panel");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showStatus(message, kind) {
      statusPanel.className = "panel status-panel " + kind;
      statusPanel.textContent = message;
    }

    function hideResults() {
      resultPanel.className = "panel hidden";
      resultPanel.innerHTML = "";
    }

    function renderMeta(result) {
      return '<section class="result-grid">'
        + '<div><span>success</span><strong>' + escapeHtml(result.success) + '</strong></div>'
        + '<div><span>attempts</span><strong>' + escapeHtml(Array.isArray(result.attempts) ? result.attempts.length : 0) + '</strong></div>'
        + '</section>';
    }

    function attemptNumber(attempt, index) {
      return attempt.attempt_number ?? attempt.attempt ?? index + 1;
    }

    function attemptSucceeded(attempt) {
      if (typeof attempt.success === "boolean") {
        return attempt.success;
      }
      return Number(attempt.exit_code) === 0;
    }

    function attemptLabel(attempt, index, total) {
      const success = attemptSucceeded(attempt);
      const errorType = String(attempt.error_type || "");
      if (total > 1 && index > 0) {
        return success ? "repaired handling" : "repair failed";
      }
      if (errorType.startsWith("HTTP")) {
        return "API response failure";
      }
      return success ? "success" : "failed";
    }

    function renderAttempt(attempt, index, attempts) {
      const success = attemptSucceeded(attempt);
      const number = attemptNumber(attempt, index);
      const label = attemptLabel(attempt, index, attempts.length);
      const errorType = attempt.error_type || "none";
      const strategy = attempt.strategy || "none";

      return '<article class="adaptive-attempt ' + (success ? "success" : "failure") + '">'
        + '<div class="attempt-marker">' + escapeHtml(number) + '</div>'
        + '<div class="attempt-body">'
        + '<div class="attempt-heading">'
        + '<h3>Attempt ' + escapeHtml(number) + ' (' + escapeHtml(label) + ')</h3>'
        + '<div class="attempt-badges">'
        + '<span class="badge badge-label">' + escapeHtml(label) + '</span>'
        + '<span class="badge badge-error">' + escapeHtml(errorType) + '</span>'
        + '<span class="badge badge-strategy">' + escapeHtml(strategy) + '</span>'
        + '</div>'
        + '</div>'
        + '<h4>code</h4>'
        + '<pre><code>' + escapeHtml(attempt.code) + '</code></pre>'
        + '<div class="result-grid">'
        + '<div><span>exit_code</span><strong>' + escapeHtml(attempt.exit_code) + '</strong></div>'
        + '<div><span>error_type</span><strong><span class="badge badge-error">' + escapeHtml(errorType) + '</span></strong></div>'
        + '<div><span>strategy</span><strong><span class="badge badge-strategy">' + escapeHtml(strategy) + '</span></strong></div>'
        + '<div class="wide output-block"><span>stdout</span><pre>' + escapeHtml(attempt.stdout) + '</pre></div>'
        + '<div class="wide output-block"><span>stderr</span><pre>' + escapeHtml(attempt.stderr) + '</pre></div>'
        + '</div>'
        + '</div>'
        + '</article>';
    }

    function renderResult(result) {
      const attempts = Array.isArray(result.attempts) ? result.attempts : [];
      const attemptsHtml = attempts.length
        ? attempts.map(renderAttempt).join("")
        : '<p>No attempts returned.</p>';
      resultPanel.className = "panel";
      resultPanel.innerHTML = '<h2>Result</h2>' + renderMeta(result) + '<div class="adaptive-timeline">' + attemptsHtml + '</div>';
      resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function buildObjective() {
      return "Call this API endpoint using Python requests.\n"
        + "URL: " + endpointUrlInput.value.trim() + "\n"
        + "Method: " + methodInput.value + "\n"
        + "Body: " + jsonBodyInput.value.trim() + "\n"
        + "Print the full response and handle errors.";
    }

    async function saveHistory(objective, result) {
      try {
        const response = await fetch("/adaptive-runs/history", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            endpoint_url: endpointUrlInput.value.trim(),
            method: methodInput.value,
            json_body: jsonBodyInput.value.trim(),
            objective,
            result
          })
        });
        if (!response.ok) {
          console.warn("Adaptive run history was not saved.");
        }
      } catch (error) {
        console.warn("Adaptive run history was not saved.", error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideResults();
      showStatus("Running adaptive execution...", "loading");
      runButton.disabled = true;
      runButton.textContent = "Running...";

      const objective = buildObjective();
      const payload = {
        objective,
        max_attempts: 3
      };

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error("HTTP " + response.status + ": " + text);
        }

        const result = await response.json();
        showStatus("Run complete.", "success");
        await saveHistory(objective, result);
        renderResult(result);
      } catch (error) {
        showStatus("Request failed: " + error.message, "error");
        statusPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      } finally {
        runButton.disabled = false;
        runButton.textContent = "Run";
      }
    });
  </script>
</body>
</html>
