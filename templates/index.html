<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightwell Runtime Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>Lightwell Runtime Agent</h1>
      <nav><a href="/">Home</a><a href="/">New run</a><a href="/adaptive-run">Adaptive run</a><a href="/history">History</a><a href="/experiments">Experiments</a></nav>
    </header>

    <section class="panel">
      <h2>New Run</h2>
      <p class="muted">Send an objective to the external AI Execution Engine and inspect the runtime result.</p>
    </section>

    <form action="/run" method="post" class="panel">
      <label>
        Objective
        <textarea name="objective" rows="7" placeholder="Write Python code that prints hello">$objective</textarea>
      </label>

      <div class="grid">
        <label>
          Mode
          <select name="mode">$mode_options</select>
        </label>
        <label>
          Experiment
          <select name="experiment">$experiment_options</select>
        </label>
        <label>
          Max attempts
          <input name="max_attempts" type="number" min="1" max="5" value="$max_attempts">
        </label>
      </div>

      <label>
        Base URL
        <input name="base_url" value="$base_url">
      </label>

      <label class="checkbox-label">
        <input name="allow_network" type="checkbox" value="true">
        Allow network access for this run
      </label>

      <button type="submit">Run</button>
    </form>

    <section class="panel">
      <h2>Latest Run</h2>
      $latest_run
    </section>
  </main>
</body>
</html>
